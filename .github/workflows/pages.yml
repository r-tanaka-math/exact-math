name: Explicitly authorized post-public website update
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    environment: website-release-approval
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Bind exact checked-out source identity
        run: |
          test -z "$(git status --porcelain)"
          printf 'EXACT_SITE_REVISION=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          printf 'EXACT_SITE_TREE=%s\n' "$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_ENV"
      - name: Load exact post-public owner update act
        env:
          OWNER_ACT: ${{ secrets.EXACT_OWNER_POSTPUBLIC_UPDATE_ACT }}
        run: |
          test -n "$OWNER_ACT"
          printf '%s' "$OWNER_ACT" > "$RUNNER_TEMP/exact-owner-postpublic-update-act.json"
      - name: Validate exact successor and build
        run: npm run build
        env:
          EXACT_PROFILE: FULL_LAUNCH
          EXACT_OUT: dist-rc4-release
          EXACT_BASE: /
          EXACT_CANONICAL_ORIGIN: https://exactmathematics.org
          EXACT_DEPLOYMENT_PROFILE: ROOT
          EXACT_PUBLIC_REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
          EXACT_FEEDBACK_MODE: LIVE_PUBLIC
          EXACT_UPDATE_ACT: ${{ runner.temp }}/exact-owner-postpublic-update-act.json
          ASTRO_TELEMETRY_DISABLED: '1'
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: dist-rc4-release
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy authorized artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
